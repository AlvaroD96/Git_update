<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Simulador de trading{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --tx:#1d2330; --mut:#667085; --bd:#e3e6ec; --ac:#2f5bd3;
          --ok:#127a44; --okbg:#e5f5ec; --bad:#b42318; --badbg:#fdecea; --warn:#8a5a00; --warnbg:#fff4dc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1a1f27; --tx:#e6e8ec; --mut:#98a2b3; --bd:#2b323d; --ac:#7aa2ff;
            --ok:#5fd394; --okbg:#173326; --bad:#ff8a80; --badbg:#3a1d1b; --warn:#f5c26b; --warnbg:#3a2e14; }
  }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--tx) }
  header { background:var(--card); border-bottom:1px solid var(--bd); padding:12px 16px; display:flex; gap:18px; align-items:center; flex-wrap:wrap }
  header b { font-size:17px } header a { color:var(--ac); text-decoration:none }
  main { max-width:1100px; margin:0 auto; padding:16px }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:16px; margin-bottom:16px }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)) }
  h1 { font-size:22px; margin:0 0 12px } h2 { font-size:17px; margin:0 0 10px } h3 { font-size:15px; margin:12px 0 6px }
  .mut { color:var(--mut); font-size:13px }
  .big { font-size:24px; font-weight:600 }
  table { width:100%; border-collapse:collapse; font-size:14px }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--bd); vertical-align:top }
  th { color:var(--mut); font-weight:500 }
  .num { text-align:right; font-variant-numeric:tabular-nums }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; background:var(--bd) }
  .ok { color:var(--ok) } .bad { color:var(--bad) }
  .tag.ok { background:var(--okbg) } .tag.bad { background:var(--badbg) } .tag.warn { background:var(--warnbg); color:var(--warn) }
  .msg { padding:10px 14px; border-radius:8px; margin-bottom:12px; background:var(--warnbg); color:var(--warn) }
  .msg.success { background:var(--okbg); color:var(--ok) } .msg.error { background:var(--badbg); color:var(--bad) }
  input, select, textarea, button { font:inherit; color:inherit }
  input, select, textarea { background:var(--bg); border:1px solid var(--bd); border-radius:6px; padding:6px 8px; width:100% }
  label { display:block; font-size:13px; color:var(--mut); margin:8px 0 2px }
  button { background:var(--ac); color:#fff; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; margin-top:10px }
  button.sec { background:transparent; color:var(--ac); border:1px solid var(--ac) }
  button.danger { background:var(--bad) }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end } .row > * { flex:1; min-width:120px }
  a { color:var(--ac) }
  .scroll { overflow-x:auto }
  .bar { height:10px; border-radius:5px; background:var(--bd); overflow:hidden; display:flex }
  .bar span { display:block; height:100% }
  details summary { cursor:pointer; color:var(--mut) }
  pre { white-space:pre-wrap; font-size:12px; background:var(--bg); padding:8px; border-radius:6px; max-height:320px; overflow:auto }
</style>
</head>
<body>
<header>
  <b>📈 Simulador de trading</b>
  <a href="{% url 'panel' %}">Panel</a>
  <a href="{% url 'escaner' %}">Escáner</a>
  <a href="{% url 'exportar_csv' %}">Diario CSV</a>
  <a href="{% url 'exportar_ordenes' %}">Órdenes (Alpaca JSON)</a>
  <span class="mut">Dinero ficticio. Educación, no asesoría financiera.</span>
</header>
<main>
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block contenido %}{% endblock %}
</main>
</body>
</html>
